name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure preinstalled Android SDK & install API 34
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "${SDK_DIR}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_DIR}/platform-tools" >> "$GITHUB_PATH"
          echo "${SDK_DIR}/build-tools/34.0.0" >> "$GITHUB_PATH"

          SDKMANAGER="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          # Disable pipefail so `yes` receiving SIGPIPE (141) does not fail the step
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="${SDK_DIR}" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="${SDK_DIR}" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install dependencies & build web assets
        run: |
          npm install
          npm run build

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Prepare Cordova www directory & CommonJS package.json for Cordova
        run: |
          rm -rf www
          mkdir -p www
          cp -r dist/* www/
          # Remove "type": "module" in CI workspace after Vite build so cordova-android's CommonJS Api.js loads cleanly
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.type; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"

      - name: Add Android platform and plugins
        run: |
          cordova --version
          cordova platform add android@13.0.0 --nosave
          for plugin in cordova-plugin-fullscreen@1.3.0 cordova-plugin-insomnia@4.3.0 cordova-plugin-brightness@0.2.0; do
            PLUGIN_ID="${plugin%@*}"
            if [ ! -d "plugins/${PLUGIN_ID}" ]; then
              cordova plugin add "${plugin}" --nosave
            fi
          done
          cordova plugin ls
          cordova requirements android

      - name: Build Debug APK
        run: cordova build android --debug

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: eink-clock-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
