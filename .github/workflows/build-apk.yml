name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 platform & build-tools
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies & build web assets
        run: |
          npm install
          npm run build

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Prepare Cordova www directory
        run: |
          rm -rf www
          mkdir -p www
          cp -r dist/* www/

      - name: Add Android platform and plugins
        run: |
          cordova telemetry off
          cordova platform add android@13.0.0 --nosave
          cordova plugin add cordova-plugin-fullscreen@1.3.0 --nosave
          cordova plugin add cordova-plugin-insomnia@4.3.0 --nosave
          cordova plugin add cordova-plugin-brightness@0.2.0 --nosave

      - name: Build Debug APK
        run: cordova build android --debug

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: eink-clock-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
