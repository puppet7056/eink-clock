<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>E-Ink 桌面資訊看板</title>
    <meta name="description" content="高對比電子紙風格桌面時鐘與資訊看板，整合桃園平鎮天氣、空氣品質與 Google 日曆行程。" />
    <meta property="og:title" content="E-Ink 桌面資訊看板" />
    <meta property="og:description" content="高對比電子紙風格桌面時鐘與資訊看板，整合桃園平鎮天氣、空氣品質與 Google 日曆行程。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+TC:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // Lightweight ES5 polyfills + startup diagnostics for older Android E-Ink WebViews (Chromium 64-83)
      (function () {
        try {
          if (typeof globalThis === 'undefined') {
            window.globalThis = window;
          }
          if (typeof window.queueMicrotask !== 'function') {
            window.queueMicrotask = function (cb) {
              Promise.resolve().then(cb).catch(function (err) {
                setTimeout(function () { throw err; }, 0);
              });
            };
          }
          if (typeof Promise !== 'undefined' && typeof Promise.allSettled !== 'function') {
            Promise.allSettled = function (promises) {
              return Promise.all(
                Array.prototype.map.call(promises, function (p) {
                  return Promise.resolve(p).then(
                    function (value) { return { status: 'fulfilled', value: value }; },
                    function (reason) { return { status: 'rejected', reason: reason }; }
                  );
                })
              );
            };
          }
          if (!Object.hasOwn) {
            Object.hasOwn = function (obj, prop) {
              return Object.prototype.hasOwnProperty.call(obj, prop);
            };
          }
          if (!Object.fromEntries) {
            Object.fromEntries = function (entries) {
              var res = {};
              if (entries && typeof entries[Symbol.iterator] === 'function') {
                var it = entries[Symbol.iterator]();
                var step;
                while (!(step = it.next()).done) {
                  if (step.value && step.value.length >= 2) {
                    res[step.value[0]] = step.value[1];
                  }
                }
              }
              return res;
            };
          }
          if (!Array.prototype.flat) {
            Array.prototype.flat = function (depth) {
              var d = depth === undefined ? 1 : Number(depth);
              var flatten = function (arr, curDepth) {
                var out = [];
                for (var i = 0; i < arr.length; i++) {
                  if (Array.isArray(arr[i]) && curDepth > 0) {
                    out = out.concat(flatten(arr[i], curDepth - 1));
                  } else if (i in arr) {
                    out.push(arr[i]);
                  }
                }
                return out;
              };
              return flatten(this, d);
            };
          }
          if (!Array.prototype.at) {
            Array.prototype.at = function (n) {
              var idx = Math.trunc(n) || 0;
              if (idx < 0) idx += this.length;
              if (idx < 0 || idx >= this.length) return undefined;
              return this[idx];
            };
          }
          if (!String.prototype.replaceAll) {
            String.prototype.replaceAll = function (search, replacement) {
              if (search instanceof RegExp) {
                return this.replace(search, replacement);
              }
              return this.split(String(search)).join(String(replacement));
            };
          }
        } catch (e) {}

        function showBootError(title, detail) {
          try {
            var root = document.getElementById('root');
            if (root && root.childElementCount > 0) return;
            var box = document.getElementById('eink-boot-error');
            if (!box) {
              box = document.createElement('div');
              box.id = 'eink-boot-error';
              box.style.cssText =
                'position:fixed;top:0;right:0;bottom:0;left:0;background:#fff;color:#000;padding:20px;font-family:sans-serif;overflow:auto;z-index:99999;';
              (document.body || document.documentElement).appendChild(box);
            }
            box.innerHTML =
              '<h2 style="margin:0 0 10px;font-size:20px;border-bottom:2px solid #000;padding-bottom:6px;">電子紙時鐘啟動診斷</h2>' +
              '<p style="font-weight:bold;margin:0 0 8px;">' + String(title) + '</p>' +
              '<pre style="white-space:pre-wrap;word-break:break-word;border:1px solid #000;padding:10px;font-size:12px;">' +
              String(detail || '') +
              '\n\nLocation: ' + String(location.href || '') +
              '\nUA: ' + String(navigator.userAgent || '') +
              '</pre>';
          } catch (err) {}
        }

        window.addEventListener('error', function (ev) {
          if (ev && ev.target && ev.target !== window && ev.target.tagName === 'SCRIPT') {
            var src = ev.target.getAttribute('src') || '';
            if (src && src.indexOf('cordova.js') === -1) {
              showBootError('腳本載入失敗', '無法載入: ' + src);
            }
            return;
          }
          if (ev && ev.message) {
            showBootError('啟動發生錯誤', ev.message + (ev.filename ? '\n' + ev.filename + ':' + ev.lineno : ''));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          var reason = ev && ev.reason;
          showBootError('啟動非同步錯誤', reason && reason.message ? reason.message : String(reason));
        });
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (!root || root.childElementCount === 0) {
              showBootError('畫面初始化逾時', '應用程式主程式未成功掛載，請截圖此診斷訊息。');
            }
          }, 8000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="cordova.js"></script>
    <script>
      (function () {
        function enableEinkDisplayMode() {
          try {
            if (window.plugins && window.plugins.insomnia && typeof window.plugins.insomnia.keepAwake === 'function') {
              window.plugins.insomnia.keepAwake();
            }
          } catch (e) {}

          try {
            if (window.AndroidFullScreen && typeof window.AndroidFullScreen.immersiveMode === 'function') {
              window.AndroidFullScreen.immersiveMode();
            }
          } catch (e) {}

          try {
            window.dispatchEvent(new Event('eink-cordova-ready'));
          } catch (e) {}
        }

        document.addEventListener('deviceready', enableEinkDisplayMode, false);
        document.addEventListener('resume', enableEinkDisplayMode, false);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
